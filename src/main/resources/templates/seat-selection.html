<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tickets Booking - Seat Selection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }
        .container-main {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-top: 30px;
        }
        .theater-screen {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 50px 50px 5px 5px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .seat-layout {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .seat {
            width: 40px;
            height: 40px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.3s;
            background: white;
        }
        .seat:hover:not(.booked) {
            transform: scale(1.1);
            border-color: #667eea;
        }
        .seat.available {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        .seat.available:hover {
            background: #45a049;
        }
        .seat.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: scale(1.15);
        }
        .seat.booked {
            background: #f44336;
            color: white;
            border-color: #f44336;
            cursor: not-allowed;
        }
        .seat.booked:hover {
            cursor: not-allowed;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 2px solid #ddd;
        }
        .summary {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            margin-bottom: 20px;
        }
        .summary h4 {
            color: #333;
            margin-bottom: 15px;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .summary-item:last-child {
            border-bottom: none;
        }
        .price-total {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
            text-align: right;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #667eea;
        }
        .btn-proceed {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn-proceed:hover {
            transform: scale(1.02);
            color: white;
        }
        .btn-proceed:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container container-main">
        <h2>🎭 Select Your Seats</h2>
        
        <div class="summary">
            <h4>Booking Summary</h4>
            <div class="summary-item">
                <span>Movie:</span>
                <strong id="movieName">-</strong>
            </div>
            <div class="summary-item">
                <span>Theater:</span>
                <strong id="theaterName">-</strong>
            </div>
            <div class="summary-item">
                <span>Selected Seats:</span>
                <strong id="selectedSeats">None</strong>
            </div>
            <div class="summary-item">
                <span>Per Seat Price:</span>
                <strong id="seatPrice">₹150</strong>
            </div>
            <div class="price-total">
                Total: <span id="totalPrice">₹0</span>
            </div>
        </div>

        <div class="theater-screen">🎬 SCREEN</div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box" style="background: #4CAF50;"></div>
                <span>Available</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #667eea;"></div>
                <span>Selected</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #f44336;"></div>
                <span>Booked</span>
            </div>
        </div>

        <div class="seat-layout" id="seatLayout">
            <!-- Seats will be generated by JavaScript -->
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <button class="btn btn-secondary w-100" onclick="window.history.back()">Back</button>
            </div>
            <div class="col-md-6">
                <button class="btn-proceed" id="proceedBtn" onclick="proceedToPayment()" disabled>Proceed to Payment</button>
            </div>
        </div>
    </div>

    <script>
        const pricePerSeat = 150;
        let selectedSeatsArray = [];

        function initializeSeats() {
            const seatLayout = document.getElementById('seatLayout');
            const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
            const seatsPerRow = 10;

            rows.forEach(row => {
                for (let i = 1; i <= seatsPerRow; i++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat available';
                    seat.textContent = row + i;
                    seat.id = 'seat-' + row + i;
                    
                    // Randomly mark some seats as booked for demo
                    if (Math.random() < 0.3) {
                        seat.className = 'seat booked';
                    }
                    
                    seat.addEventListener('click', function() {
                        toggleSeat(this);
                    });
                    seatLayout.appendChild(seat);
                }
            });
        }

        function toggleSeat(seatElement) {
            if (seatElement.classList.contains('booked')) return;
            
            const seatId = seatElement.id.replace('seat-', '');
            
            if (seatElement.classList.contains('selected')) {
                seatElement.classList.remove('selected');
                seatElement.classList.add('available');
                selectedSeatsArray = selectedSeatsArray.filter(s => s !== seatId);
            } else {
                seatElement.classList.remove('available');
                seatElement.classList.add('selected');
                selectedSeatsArray.push(seatId);
            }
            
            updateSummary();
        }

        function updateSummary() {
            const totalPrice = selectedSeatsArray.length * pricePerSeat;
            document.getElementById('selectedSeats').textContent = selectedSeatsArray.length > 0 ? selectedSeatsArray.join(', ') : 'None';
            document.getElementById('totalPrice').textContent = '₹' + totalPrice;
            document.getElementById('proceedBtn').disabled = selectedSeatsArray.length === 0;
        }

        function proceedToPayment() {
            if (selectedSeatsArray.length === 0) {
                alert('Please select at least one seat!');
                return;
            }
            alert('Proceeding with seats: ' + selectedSeatsArray.join(', '));
            // Redirect to payment page
            window.location.href = '/payment?seats=' + selectedSeatsArray.join(',');
        }

        // Initialize on page load
        window.onload = function() {
            initializeSeats();
            document.getElementById('movieName').textContent = 'Sample Movie';
            document.getElementById('theaterName').textContent = 'PVR Cinema';
        };
    </script>
</body>
</html>
